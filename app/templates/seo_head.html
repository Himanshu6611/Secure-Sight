    <title>{{ seo.page.title if seo.page else 'SecureSight — Analysis' }}</title>
    <meta name="description" content="{{ seo.page.description if seo.page else 'Inspect threat evidence with explicit analysis limits.' }}">
    <meta name="robots" content="{{ 'index, follow' if seo.indexable else 'noindex, nofollow' }}">
    {% if seo.canonical %}<link rel="canonical" href="{{ seo.canonical }}">{% endif %}
    <meta property="og:site_name" content="SecureSight">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="{{ seo.page.title if seo.page else 'SecureSight' }}">
    <meta property="og:description" content="{{ seo.page.description if seo.page else 'Evidence and analysis limits.' }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ seo.page.title if seo.page else 'SecureSight' }}">
    <meta name="twitter:description" content="{{ seo.page.description if seo.page else 'Evidence and analysis limits.' }}">
    {% if seo.canonical %}
    <meta property="og:url" content="{{ seo.canonical }}">
    <meta property="og:image" content="{{ seo.social_image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SecureSight — URL, email and media threat evidence">
    <meta name="twitter:image" content="{{ seo.social_image }}">
    {% endif %}
    {% if seo.schema %}<script nonce="{{ g.csp_nonce }}" type="application/ld+json" id="securesight-jsonld">{{ seo.schema | tojson }}</script>{% endif %}
