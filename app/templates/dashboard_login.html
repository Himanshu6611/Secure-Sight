<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SecureSight · Analyst sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}"></head>
<body><main class="login-card"><a href="/" class="wordmark">SecureSight <span>INVESTIGATIONS</span></a><h1>Analyst sign in</h1><p>Access investigations and cases in your authorized workspace.</p>
{% if message %}<p role="alert" class="error">{{ message }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ dashboard_csrf() }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">Sign in</button></form>
<p class="muted">Accounts are provisioned by the workspace operator. No default credentials are enabled.</p></main></body></html>
