# Single-host production topology. Keep this separate from docker-compose.yml.
# Build and publish the image in CI, then set SECURESIGHT_IMAGE to its sha256 digest.
services:
  secure-sight:
    image: ${SECURESIGHT_IMAGE:?Set SECURESIGHT_IMAGE to a registry image pinned by sha256 digest}
    pull_policy: always
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      APP_ENV: production
      FLASK_SECRET_KEY_FILE: /run/secrets/flask_secret_key
      SITE_URL: ${SITE_URL:?Set the public HTTPS origin}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set explicit public hostnames}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set explicit HTTPS browser origins}
      RATELIMIT_STORAGE_URI_FILE: /run/secrets/redis_url
      DASHBOARD_DB_PATH: /var/lib/securesight/dashboard.sqlite3
      DASHBOARD_ENCRYPTION_KEY_FILE: /run/secrets/dashboard_encryption_key
      SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}
      HF_HUB_OFFLINE: "1"
      WEB_CONCURRENCY: "1"
    volumes:
      - securesight_state:/var/lib/securesight
    secrets:
      - flask_secret_key
      - dashboard_encryption_key
      - redis_url
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  securesight_state:

# Source these files from a root-owned host directory or materialize them from
# the deployment secret manager. Values never enter Compose environment output.
secrets:
  flask_secret_key:
    file: ${FLASK_SECRET_KEY_FILE:?Set path to the Flask key secret file}
  dashboard_encryption_key:
    file: ${DASHBOARD_ENCRYPTION_KEY_FILE:?Set path to the dashboard key secret file}
  redis_url:
    file: ${RATELIMIT_STORAGE_URI_FILE:?Set path to the authenticated private Redis URL secret file}
